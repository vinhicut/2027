version: '3.8'

services:
  tuvi-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuvi_hongan_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - CORS_ORIGIN=*
      - CUSTOMER_API_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
