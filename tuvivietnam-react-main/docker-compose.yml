services:
  tuvi-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuvi_hongan_app
    restart: unless-stopped
    ports:
      - "2026:2026"
    environment:
      HOST: 0.0.0.0
      PORT: 2026
      CORS_ORIGIN: "*"
      CUSTOMER_API_URL: ${CUSTOMER_API_URL:-http://host.docker.internal:3001}
      BOOKING_NOTIFICATION_EMAIL: ${BOOKING_NOTIFICATION_EMAIL:-nguyenvinhvan90@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
